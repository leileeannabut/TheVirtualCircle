<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1024"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<title>Circle Hubs — The Virtual Circle</title></head><body>
<main class="wrap page" style="padding-bottom:1.5rem">
  <div class="chat">
    <aside class="card soft" style="padding:.6rem" id="side" aria-label="Channels"></aside>
    <section class="card thread" style="margin:0">
      <header><b id="ch-name">#</b><p class="muted small" id="ch-desc"></p></header>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="composer" id="comp"><textarea id="text" placeholder="Say something kind…" aria-label="Message" maxlength="1200" required></textarea><button class="btn">Send</button></form>
    </section>
  </div>
  <p class="faint small center" style="margin-top:1rem">Phone numbers, emails and WhatsApp/Telegram links are hidden automatically. Repeat attempts lead to a mute or ban.</p>
</main>
<script type="module">
import { api, $, esc, shell, toast, ago, hostChip, safeDecode } from '/js/app.js';
const { user: me } = await shell({ auth: true, needActive: true });
const cfg = await api('config'); const { dms } = await api('hubs/dms');
const groups = { Luzon: [], Visayas: [], Mindanao: [], All: [] };
cfg.hubs.forEach((h) => (groups[h.region] || groups.All).push(h));
const DESC = Object.fromEntries(cfg.hubs.map((h) => [h.id, h]));
$('#side').innerHTML = ['All', 'Luzon', 'Visayas', 'Mindanao'].map((g) => `<h4>${g === 'All' ? 'Sanctuary' : g}</h4>` +
  groups[g].map((h) => `<a href="#${h.id}" data-ch="${h.id}">${esc(h.name)}</a>`).join('')).join('') +
  (dms.length ? '<h4>Client chats</h4>' + dms.map((d) => `<a href="#${encodeURIComponent(d.channel)}" data-ch="${esc(d.channel)}">💬 ${esc(d.name)}</a>`).join('') : '');

let ch = '', last = 0, timer;
async function open(id) {
  ch = id; last = 0; $('#msgs').innerHTML = '';
  document.querySelectorAll('#side a').forEach((a) => a.classList.toggle('on', a.dataset.ch === id));
  const d = DESC[id]; const dm = dms.find((x) => x.channel === id);
  $('#ch-name').textContent = d ? d.name : dm ? 'Chat with ' + dm.name : id;
  $('#ch-desc').textContent = id === 'vent-room' ? 'Posts here are anonymous. Kind replies only. 💛' : id.startsWith('dm:') ? 'Private, on-platform conversation.' : (d && d.region !== 'All' ? d.region + ' hub' : 'For everyone in the circle');
  clearInterval(timer); await poll(); timer = setInterval(poll, 5000);
}
async function poll() {
  try {
    const { messages } = await api('hubs/messages?channel=' + encodeURIComponent(ch) + '&after=' + last);
    if (!messages.length && !last) $('#msgs').innerHTML = '<div class="empty">Be the first to say hello 👋</div>';
    if (messages.length && !last) $('#msgs').innerHTML = '';
    const box = $('#msgs'); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    messages.forEach((m) => { last = Math.max(last, m.ts);
      box.insertAdjacentHTML('beforeend', `<div class="bubble ${m.mine ? 'mine' : ''}"><span class="who">${esc(m.name)}${m.host ? ' ' + hostChip() : ''}</span><span class="when">${ago(m.ts)}</span><p>${esc(m.text)}</p></div>`); });
    if (atBottom || messages.some((m) => m.mine)) box.scrollTop = box.scrollHeight;
  } catch (e) { clearInterval(timer); toast(e.message, 'err'); }
}
$('#comp').onsubmit = async (e) => { e.preventDefault(); const text = $('#text').value.trim(); if (!text) return;
  try { const r = await api('hubs/post', { body: { channel: ch, text } }); $('#text').value = '';
    if (r.flagged) toast('Contact details were hidden — please keep conversations on-platform.' + (r.action && r.action !== 'logged' ? ' Safety action: ' + r.action.replace('_', ' ') + '.' : ''), 'err');
    await poll(); } catch (err) { toast(err.message, 'err'); } };
$('#text').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#comp').requestSubmit(); } };
const pick = () => open(safeDecode(location.hash.slice(1)) || me.hub || 'night-shift-lounge');
window.onhashchange = pick; pick();
</script>
</body></html>
