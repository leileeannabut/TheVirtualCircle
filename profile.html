<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1024"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<title>Circle Profile — The Virtual Circle</title></head><body>
<main class="wrap page">
  <section class="card glow" id="head" style="margin-bottom:2rem"></section>
  <div class="split">
    <div class="stack"><h2 style="font-size:1.5rem">Posts</h2><div id="posts" class="stack"></div></div>
    <aside class="stack"><div class="card" id="about"></div><div class="card" id="certs"></div></aside>
  </div>
</main>
<script type="module">
import { api, $, esc, shell, toast, ago, chip, rankChip, avatar } from '/js/app.js';
const { user: me } = await shell({ auth: true, needActive: true });
const id = new URLSearchParams(location.search).get('id') || me.id;
const r = await api('profile?id=' + encodeURIComponent(id)); const p = r.profile;
document.title = p.name + ' — The Virtual Circle';
const action = () => {
  if (r.me) return `<button class="btn ghost sm" id="edit-head">Edit headline</button><a class="btn quiet sm" href="/app.html">Edit profile</a>`;
  if (p.host) return '';
  const c = r.connection;
  const btn = !c ? '<button class="btn sm" data-act="connect">🤝 Connect</button>'
    : c.status === 'accepted' ? '<button class="btn quiet sm" data-act="remove">✓ Connected</button>'
    : c.outgoing ? '<button class="btn quiet sm" disabled>Request sent</button>' : '<button class="btn sm" data-act="accept">Accept request</button>';
  return btn + (r.can_dm ? `<a class="btn ghost sm" href="/messages.html?to=${p.id}">✉️ Message</a>` : '');
};
const draw = () => {
  $('#head').innerHTML = `<div class="row" style="gap:1.25rem;align-items:center">${avatar(p.name, 88, p.supporter)}<div style="flex:1;min-width:220px">
    <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);margin:0">${esc(p.name)}</h1><p class="muted" style="margin:.2rem 0 .6rem">${esc(p.headline || (p.account_type === 'client' ? 'Client' : 'Virtual Assistant'))}</p>
    <div class="chips">${rankChip(p.rank_name, p.va_rank)}${p.pro ? chip('✨ Tier 2', 'amber') : ''}${p.supporter ? chip('Glow Keeper ✨', 'amber') : ''}${p.ambassador ? chip('🌟 Founding Ambassador', 'amber') : ''}${p.hub ? chip('#' + p.hub) : ''}${p.years_experience ? chip(p.years_experience + ' yrs experience') : ''}</div></div>
    <div class="row">${action()}</div></div>
    <div class="row" style="gap:2rem;margin-top:1.25rem"><span><b class="amber">${r.counts.connections}</b> <span class="muted small">connections</span></span><span><b class="amber">${r.counts.posts}</b> <span class="muted small">posts</span></span>
    <span><b class="amber">${p.sim_score || '—'}</b> <span class="muted small">practice score</span></span></div>`;
};
draw();
if (p.host) $('#head').insertAdjacentHTML('beforeend', '<div class="notice" style="margin-top:1rem">🤖 <b>' + esc(p.name) + ' is a Circle Host: an AI helper run by The Virtual Circle team, not a member.</b> Hosts post conversation starters and reply when nobody else has yet. They can\'t connect, chat privately, or take part in Circle BFF, Jobs or Talent.</div>');
$('#about').innerHTML = `<h3>About</h3><p class="muted small">${esc(p.bio || 'No bio yet.')}</p><div class="chips">${String(p.skills || '').split(',').filter(Boolean).map((s) => chip(s.trim())).join('')}</div>
  <hr class="divider"><div class="chips">${p.badges.map((b) => chip('✦ ' + b, 'amber')).join('') || '<span class="faint small">No badges yet</span>'}</div>`;
$('#certs').innerHTML = `<h3>Certificates</h3>${r.certificates.length ? '<ul class="list">' + r.certificates.map((c) => `<li><span>🎓 ${esc(c.title)}</span><span class="faint small">${ago(c.ts)}</span></li>`).join('') + '</ul>' : '<p class="muted small">None yet.</p>'}`;
$('#head').onclick = async (e) => {
  if (e.target.id === 'edit-head') { const h = prompt('Your headline (e.g. "Night-shift support lead · Shopify · 4 yrs")', p.headline || ''); if (h === null) return;
    await api('profile/headline', { body: { headline: h } }); p.headline = h; return draw(); }
  const a = e.target.dataset.act; if (!a) return;
  try {
    if (a === 'connect' || a === 'accept') { const x = await api('connect/request', { body: { user_id: p.id } }); r.connection = { status: x.status, outgoing: x.status === 'pending' }; }
    if (a === 'remove' && confirm('Remove this connection?')) { await api('connect/remove', { body: { user_id: p.id } }); r.connection = null; }
    const fresh = await api('profile?id=' + encodeURIComponent(id)); Object.assign(r, fresh); draw();
  } catch (err) { toast(err.message, 'err'); }
};
const { posts } = await api('feed?user=' + encodeURIComponent(p.id));
$('#posts').innerHTML = posts.map((x) => `<a class="card post" href="/feed.html#${x.id}" style="display:block;color:inherit;text-decoration:none"><span class="faint small">${ago(x.ts)} · ${x.reactions} reactions · ${x.comments} comments</span>
  <p class="post-body" style="margin-top:.5rem">${esc(x.text)}</p></a>`).join('') || '<div class="empty">No posts yet.</div>';
</script>
</body></html>
